<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#grad1)" stroke="#fff" stroke-width="8"/>
  
  <!-- Music note symbol -->
  <g fill="#fff">
    <!-- Note stem -->
    <rect x="100" y="80" width="8" height="80" rx="4"/>
    <rect x="140" y="60" width="8" height="100" rx="4"/>
    
    <!-- Note heads -->
    <ellipse cx="104" cy="160" rx="16" ry="12"/>
    <ellipse cx="144" cy="160" rx="16" ry="12"/>
    
    <!-- Connecting beam -->
    <path d="M108 80 L148 60 L148 68 L108 88 Z"/>
    
    <!-- Discord-style decoration -->
    <circle cx="180" cy="100" r="12" fill="#5865F2"/>
    <circle cx="200" cy="120" r="8" fill="#5865F2"/>
  </g>
  
  <!-- Roon-style wave -->
